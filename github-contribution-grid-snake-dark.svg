<svg xmlns="http://www.w3.org/2000/svg" width="920" height="190" viewBox="0 0 920 190" role="img" aria-label="Animated green contribution board">
  <style>
    @keyframes glowPulse {
      0%, 100% { opacity: .55; }
      50% { opacity: 1; }
    }
    @keyframes dashFlow {
      to { stroke-dashoffset: -920; }
    }
    .title { font: 700 16px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #c9d1d9; }
    .muted { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #8b949e; }
    .track { stroke-dasharray: 18 18; animation: dashFlow 18s linear infinite; }
    .spark { animation: glowPulse 1.8s ease-in-out infinite; }
  </style>

  <defs>
    <pattern id="green-grid" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" x="2" y="2" rx="2" fill="#26a641" opacity=".95"/>
    </pattern>
    <linearGradient id="snakeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9be564"/>
      <stop offset="45%" stop-color="#39d353"/>
      <stop offset="100%" stop-color="#7ee787"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <path id="snakePath" d="M54 63 H866 V83 H54 V103 H866 V123 H54 V143 H866"/>
  </defs>

  <rect width="920" height="190" rx="16" fill="#0d1117"/>
  <rect x="20" y="20" width="880" height="150" rx="14" fill="#07130b" stroke="#238636" opacity=".95"/>

  <text x="42" y="48" class="title">Rustambekov9545 contribution board</text>
  <text x="690" y="48" class="muted">green mode active</text>

  <rect x="42" y="58" width="836" height="96" rx="8" fill="#161b22"/>
  <rect x="48" y="62" width="824" height="88" rx="6" fill="url(#green-grid)" opacity=".94"/>
  <rect x="48" y="62" width="824" height="88" rx="6" fill="#39d353" opacity=".08"/>

  <use href="#snakePath" fill="none" stroke="#39d353" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" opacity=".14"/>
  <use href="#snakePath" class="track" fill="none" stroke="url(#snakeGradient)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)"/>

  <circle r="8" fill="#f0fff4" filter="url(#softGlow)">
    <animateMotion dur="8s" repeatCount="indefinite">
      <mpath href="#snakePath"/>
    </animateMotion>
  </circle>
  <circle r="6" fill="#7ee787" opacity=".9">
    <animateMotion dur="8s" begin=".16s" repeatCount="indefinite">
      <mpath href="#snakePath"/>
    </animateMotion>
  </circle>
  <circle r="5" fill="#39d353" opacity=".78">
    <animateMotion dur="8s" begin=".32s" repeatCount="indefinite">
      <mpath href="#snakePath"/>
    </animateMotion>
  </circle>

  <circle class="spark" cx="822" cy="72" r="4" fill="#9be564"/>
  <circle class="spark" cx="780" cy="128" r="4" fill="#9be564"/>
  <circle class="spark" cx="104" cy="116" r="4" fill="#9be564"/>
</svg>
