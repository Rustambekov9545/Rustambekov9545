<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title description">
  <title id="title">Abdulloh Rustambekov, Frontend Developer</title>
  <desc id="description">Animated developer profile header with a dark green digital background and moving light trails.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020a0d"/>
      <stop offset=".48" stop-color="#041016"/>
      <stop offset="1" stop-color="#02070b"/>
    </linearGradient>
    <radialGradient id="greenGlow" cx="88%" cy="0%" r="78%">
      <stop offset="0" stop-color="#24dd67" stop-opacity=".58"/>
      <stop offset=".28" stop-color="#139a47" stop-opacity=".23"/>
      <stop offset=".66" stop-color="#07311a" stop-opacity=".08"/>
      <stop offset="1" stop-color="#02080c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#48f27d" stop-opacity="0"/>
      <stop offset=".5" stop-color="#d9ffe5"/>
      <stop offset="1" stop-color="#55f889" stop-opacity=".1"/>
    </linearGradient>
    <linearGradient id="button" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#45e676"/>
      <stop offset="1" stop-color="#20b952"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0v24" fill="none" stroke="#1f603b" stroke-width=".7" opacity=".21"/>
      <circle cx="4" cy="4" r="1.25" fill="#3ce673" opacity=".38"/>
      <circle cx="16" cy="11" r=".75" fill="#76f99b" opacity=".16"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="largeGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="25"/>
    </filter>
    <clipPath id="clip">
      <rect x="8" y="8" width="1184" height="304" rx="14"/>
    </clipPath>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .grid-flow { animation: gridFlow 14s linear infinite; }
      .trail-flow { stroke-dasharray: 120 46; animation: trailFlow 8s linear infinite; }
      .trail-flow-slow { stroke-dasharray: 65 75; animation: trailFlow 11s linear reverse infinite; }
      .pulse { animation: pulse 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .float { animation: float 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .star { animation: star 3.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .star-delay { animation: star 3.4s ease-in-out 1.4s infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes gridFlow { to { transform: translateX(48px); } }
      @keyframes trailFlow { to { stroke-dashoffset: -332; } }
      @keyframes pulse { 0%,100% { opacity: .65; transform: scale(.9); } 50% { opacity: 1; transform: scale(1.08); } }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
      @keyframes star { 0%,100% { opacity: .18; transform: scale(.7); } 50% { opacity: 1; transform: scale(1.35); } }
    </style>
  </defs>

  <rect width="1200" height="320" rx="16" fill="#050b0f"/>
  <rect x="8" y="8" width="1184" height="304" rx="14" fill="url(#background)" stroke="#1d3c2d" stroke-width="1.4"/>

  <g clip-path="url(#clip)">
    <rect x="8" y="8" width="1184" height="304" fill="url(#greenGlow)"/>
    <g class="grid-flow">
      <rect x="-48" y="8" width="740" height="304" fill="url(#grid)" opacity=".72"/>
    </g>
    <ellipse cx="1020" cy="4" rx="310" ry="120" fill="#29e369" opacity=".1" filter="url(#largeGlow)"/>
    <path d="M758 38 C910 70 1068 135 1210 253" fill="none" stroke="#1ec75a" stroke-width="38" opacity=".08" filter="url(#largeGlow)"/>
    <path class="trail-flow" d="M748 36 C923 72 1065 137 1212 257" fill="none" stroke="url(#trail)" stroke-width="2.3" filter="url(#glow)"/>
    <path class="trail-flow-slow" d="M835 52 C976 90 1091 155 1197 243" fill="none" stroke="#5aff8e" stroke-width="1.1" opacity=".65"/>
    <circle class="star" cx="916" cy="78" r="2.1" fill="#caffd8"/>
    <circle class="star-delay" cx="1032" cy="122" r="2.8" fill="#91ffad"/>
    <circle class="star" cx="1125" cy="188" r="1.8" fill="#e0ffe8"/>
    <circle class="star-delay" cx="852" cy="152" r="1.4" fill="#5dff90"/>
    <circle class="star" cx="986" cy="211" r="1.6" fill="#75ff9b"/>
  </g>

  <text x="168" y="92" fill="#f5faf6" font-size="41" font-weight="750">Abdulloh Rustambekov</text>

  <text x="168" y="133" fill="#c1ccd0" font-size="15">Frontend Developer</text>
  <circle cx="342" cy="128" r="3.4" fill="#3ee573"/>
  <text x="358" y="133" fill="#c1ccd0" font-size="15">React</text>
  <circle cx="416" cy="128" r="3.4" fill="#3ee573"/>
  <text x="432" y="133" fill="#c1ccd0" font-size="15">Next.js</text>
  <circle cx="507" cy="128" r="3.4" fill="#3ee573"/>
  <text x="523" y="133" fill="#c1ccd0" font-size="15">TypeScript</text>

  <text x="168" y="178" fill="#9eabb2" font-size="14">I craft polished, fast, and predictable interfaces.</text>
  <text x="168" y="202" fill="#9eabb2" font-size="14">I care about component architecture, responsive layouts,</text>
  <text x="168" y="226" fill="#9eabb2" font-size="14">accessibility, smooth animation, and clean production delivery.</text>

  <g class="float">
    <rect x="168" y="252" width="196" height="44" rx="7" fill="url(#button)" filter="url(#glow)"/>
    <path d="M188 266h14v12h-14zm3-3v3m8-3v3" fill="none" stroke="#03210d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="214" y="280" fill="#021108" font-size="13" font-weight="700">View Repositories</text>
  </g>

  <rect x="380" y="252" width="148" height="44" rx="7" fill="#0b151b" stroke="#2b3d46"/>
  <path d="M400 265h17v13h-17zm0 0 8.5 7 8.5-7" fill="none" stroke="#94a3ab" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="428" y="280" fill="#b4bec3" font-size="13">Contact Me</text>

  <rect x="940" y="252" width="218" height="40" rx="20" fill="#071218" stroke="#23373f"/>
  <circle class="pulse" cx="962" cy="272" r="5.2" fill="#38e56e" filter="url(#glow)"/>
  <text x="978" y="277" fill="#c7d1d5" font-size="12">Available for opportunities</text>
</svg>
